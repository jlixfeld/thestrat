name: Codex review signal

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  signal:
    if: github.event.review.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Signal exact-commit native Codex review
        run: "true"
